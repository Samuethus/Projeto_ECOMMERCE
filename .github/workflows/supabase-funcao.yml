# Publica a Edge Function "producao" no Supabase sempre que o código dela mudar na main.
# Requer o secret do repositório SUPABASE_ACCESS_TOKEN
# (GitHub → Settings → Secrets and variables → Actions → New repository secret).
name: Publicar função Supabase

on:
  push:
    branches: [main]
    paths:
      - "supabase/functions/**"
      - "supabase/config.toml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: fxennfueoqdfhmnbrsrf
    steps:
      - uses: actions/checkout@v4

      - name: Verificar token
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Cadastre o secret SUPABASE_ACCESS_TOKEN no repositório para publicar a função."
            exit 1
          fi

      - uses: supabase/setup-cli@v1
        with:
          version: 2.121.0

      # --no-verify-jwt: a função valida o login internamente (chaves novas do Supabase)
      - name: Publicar função producao
        run: supabase functions deploy producao --project-ref "$PROJECT_REF" --no-verify-jwt --use-api
